name: PR checks

"on":
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/pr-checks.yml'

permissions:
  contents: write

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-live-readiness:
    name: Migrate browser smoke readiness
    if: github.head_ref == 'fix/browser-smoke-live-readiness'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Replace obsolete network-idle readiness
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('web/scripts/native-session-browser-smoke.mjs'),
              Path('web/scripts/native-opencode-browser-smoke.mjs'),
              Path('web/scripts/native-opencode-real-regression-smoke.mjs'),
              Path('web/scripts/v3-browser-smoke.mjs'),
              Path('web/scripts/v3-browser-controls-smoke.mjs'),
          ]

          changed = 0
          for path in paths:
              text = path.read_text()
              updated = text.replace('waitUntil: "networkidle"', 'waitUntil: "domcontentloaded"')
              updated = updated.replace('waitForLoadState("networkidle")', 'waitForLoadState("domcontentloaded")')
              if updated != text:
                  path.write_text(updated)
                  changed += 1

          if changed == 0:
              raise SystemExit('no browser smoke files needed migration')
          print(f'migrated {changed} browser smoke files')
          PY

      - name: Commit migrated tests
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/scripts
          git commit -m "test(web): use explicit readiness for live-stream smokes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
