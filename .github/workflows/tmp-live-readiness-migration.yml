name: One-shot browser smoke readiness migration

on:
  push:
    branches:
      - fix/browser-smoke-live-readiness

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/browser-smoke-live-readiness
          fetch-depth: 0

      - name: Replace obsolete network-idle readiness and restore smoke gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          smoke_paths = [
              Path('web/scripts/native-session-browser-smoke.mjs'),
              Path('web/scripts/native-opencode-browser-smoke.mjs'),
              Path('web/scripts/native-opencode-real-regression-smoke.mjs'),
              Path('web/scripts/v3-browser-smoke.mjs'),
              Path('web/scripts/v3-browser-controls-smoke.mjs'),
          ]

          replacements = 0
          for path in smoke_paths:
              text = path.read_text()
              updated = text.replace('waitUntil: "networkidle"', 'waitUntil: "domcontentloaded"')
              updated = updated.replace('waitForLoadState("networkidle")', 'waitForLoadState("domcontentloaded")')
              replacements += text.count('waitUntil: "networkidle"')
              replacements += text.count('waitForLoadState("networkidle")')
              path.write_text(updated)

          workflow = Path('.github/workflows/pr-checks.yml')
          text = workflow.read_text()
          old_comment = '''  # Source-level assertions are useful but cannot tell us whether a control is actually clipped or
  # whether real browser state produces duplicate turns. Keep the browser gate on smoke tests whose
  # readiness contract is compatible with the live event streams introduced in #363. Three older
  # deep PI/OpenCode scripts still wait for Playwright `networkidle`, which can never be authoritative
  # while their fake daemon deliberately keeps /global/event open; they remain in the repository for
  # conversion to explicit UI readiness rather than producing deterministic false-negative checks.
'''
          new_comment = '''  # Source-level assertions are useful but cannot tell us whether a control is actually clipped or
  # whether real browser state produces duplicate turns. The browser gate therefore drives the
  # production build and waits on explicit product/UI state; persistent live event streams are not
  # treated as page-readiness signals.
'''
          if old_comment not in text:
              raise SystemExit('expected browser-smoke comment block not found')
          text = text.replace(old_comment, new_comment)

          old_run = '''      - name: Run live-stream-compatible native Session smoke
        run: |
          node scripts/native-session-navigation-smoke.mjs
          node scripts/native-session-model-switch-smoke.mjs
'''
          new_run = '''      - name: Run native Session transcript and composer smoke
        run: |
          node scripts/native-session-navigation-smoke.mjs
          node scripts/native-session-browser-smoke.mjs
          node scripts/native-opencode-browser-smoke.mjs
          node scripts/native-opencode-real-regression-smoke.mjs
          node scripts/native-session-model-switch-smoke.mjs
'''
          if old_run not in text:
              raise SystemExit('expected reduced native smoke block not found')
          workflow.write_text(text.replace(old_run, new_run))

          if replacements == 0:
              raise SystemExit('no obsolete networkidle readiness contracts were found')
          print(f'replaced {replacements} obsolete networkidle readiness contracts')
          PY

          rm .github/workflows/tmp-live-readiness-migration.yml

      - name: Commit migrated smoke tests
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/scripts .github/workflows/pr-checks.yml .github/workflows/tmp-live-readiness-migration.yml
          git commit -m "test(web): use explicit readiness for live-stream smokes"
          git push origin HEAD:fix/browser-smoke-live-readiness
